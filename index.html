:root{

  --line:#CFD8D4; --go:#1F6F5C; --go-d:#175443; --red:#B3261E; --red-bg:#FBEAE8;
  --gold:#C8842B; --sea:#24608C; --white:#FFFFFF;
  --sp:16px; --r:10px;
  --fs:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:var(--fs); line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--sea)}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── 頂部 ── */
header{position:sticky;top:0;z-index:40;background:var(--ink);color:var(--paper);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.hrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:8px}
.hrow h1{font-size:1.02em}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:.86em;color:#B9C7C2}
.clock b{color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:20px;
  background:#2B3A35;color:#C9D6D1;font-size:.85em;white-space:nowrap}
nav button.on{background:var(--paper);color:var(--ink);font-weight:700}
nav button{position:relative}
nav button.today{background:var(--gold);color:#2A1B05;font-weight:700}
nav button.today.on{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold)}
nav button.dl::after{content:"";position:absolute;top:7px;right:8px;width:6px;height:6px;
  border-radius:50%;background:var(--red)}
nav button.dl{padding-right:20px}

/* ── 內容 ── */
main{padding:var(--sp) 14px 90px;max-width:720px;margin:0 auto}
.dayhead{margin-bottom:14px}
.dayhead .dt{font-size:.78em;color:var(--dim);font-variant-numeric:tabular-nums}
.dayhead h2{font-size:1.55em;line-height:1.24;margin:3px 0 5px;letter-spacing:-.025em;
  text-wrap:balance;word-break:break-word}
.dayhead h2.long{font-size:1.24em;line-height:1.3;letter-spacing:-.01em}
.dayhead .sub{font-size:.85em;color:var(--ink2)}

/* ── 時間軸 ── */
.rail{position:relative;padding-left:18px}
.rail::before{content:"";position:absolute;left:4px;top:14px;bottom:14px;width:2px;background:var(--line)}
.slot{position:relative;padding:16px 0 18px}
.slot::before{content:"";position:absolute;left:-18px;top:22px;width:10px;height:10px;
  border-radius:50%;background:var(--paper);box-shadow:0 0 0 2px var(--go)}
.slot.dead::before{background:var(--red);box-shadow:0 0 0 2px var(--red)}
.slot.dead{background:var(--red-bg);margin:0 -12px 0 -12px;padding:16px 12px 18px 12px;border-radius:var(--r)}
.slot.dead::before{left:-6px}
.tm{font-variant-numeric:tabular-nums;font-size:.82em;color:var(--dim);letter-spacing:.02em}
.tm b{font-size:.94em;color:var(--ink)}
.tm .shift{color:var(--red);font-weight:700}
.st{font-size:1.1em;font-weight:700;line-height:1.38;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0 0}
.tag{font-size:.76em;padding:3px 8px;border-radius:5px;background:var(--paper2);color:var(--ink2)}
.tag.t-warn{background:var(--red);color:#fff;font-weight:700}
.tag.t-open{background:#DEF0E8;color:var(--go-d);font-weight:700}
.tag.t-soon{background:#FDF0DC;color:#8A5A12;font-weight:700}
.tag.t-shut{background:var(--red-bg);color:var(--red);font-weight:700}
.x{margin:10px 0 0;font-size:.95em;line-height:1.7;color:var(--ink2)}
.x ul{margin:0;padding-left:19px}
.x li{margin:4px 0}
.x b{color:var(--ink)}
.deadline{margin:10px 0 0;font-size:.9em;font-weight:700;color:var(--red)}
.arrived{margin:9px 0 0;font-size:.82em;color:var(--go-d);font-weight:700}

/* ── 按鈕列 ── */
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;align-items:center}
.btn{min-height:44px;padding:0 14px;border-radius:9px;font-size:.88em;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ico{width:48px;padding:0;font-size:1.05em}
.btn.go{background:var(--go);color:#fff}
.btn.sec{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.on{background:var(--go-d);color:#fff}
.more{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 0}
.more button,.more a{min-height:36px;padding:0 12px;border-radius:6px;font-size:.82em;
  background:var(--paper2);color:var(--ink2);display:inline-flex;align-items:center;text-decoration:none}
details{margin:9px 0 0}
details summary{min-height:34px;display:flex;align-items:center;
  font-weight:700;color:var(--go-d);cursor:pointer;font-size:.85em}
details .body{font-size:.92em;color:var(--ink2);padding:6px 0 0;line-height:1.65}
details ol{margin:0;padding-left:20px}
details li{margin:5px 0}

/* ── 通用區塊 ── */
.card{background:var(--white);border-radius:var(--r);padding:14px;margin:0 0 12px;
  box-shadow:inset 0 0 0 1px var(--line)}
.card h3{font-size:1.02em;margin:0 0 8px}
.note{font-size:.92em;color:var(--ink2);line-height:1.7}
.warn{background:var(--red-bg);box-shadow:inset 0 0 0 1px #E9C4C0}
.warn h3{color:var(--red)}
.ok{background:#E4F1EB;box-shadow:inset 0 0 0 1px #B9D9CC}
.sec-t{font-size:.8em;color:var(--dim);margin:20px 0 8px;font-weight:700}
.empty{text-align:center;padding:26px 16px}
.empty b{display:block;font-size:1.05em;margin-bottom:5px}
table{width:100%;border-collapse:collapse;font-size:.92em}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:700;font-size:.85em}
input,select,textarea{font-family:inherit;font-size:16px;padding:10px;border-radius:8px;
  border:1px solid var(--line);background:var(--white);color:var(--ink);width:100%}
label{font-size:.82em;color:var(--dim);display:block;margin:0 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:0 0 10px}
.row>div{flex:1 1 120px}
.mono{font-variant-numeric:tabular-nums}
.av{width:42px;height:42px;border-radius:50%;background:var(--go);color:#fff;
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:.62em;line-height:1.15;font-weight:700;flex:0 0 auto;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av .n{font-size:.52em;opacity:.85}
.av.sm{width:30px;height:30px;font-size:.78em}
.pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:.78em;
  background:var(--paper2);color:var(--ink2)}
.paid{opacity:.45;text-decoration:line-through}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;font-size:.92em;
  max-width:88vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}

.fsbar{display:flex;gap:6px;align-items:center;margin-left:auto}
.fsbar button{min-width:40px;min-height:36px;border-radius:8px;background:#2B3A35;color:#C9D6D1;font-weight:700}
.fsbar button.on{background:var(--paper);color:var(--ink)}
</style>

/* ===== ICS 匯出（RFC 5545） ===== */
/* 澳洲東部標準時間 UTC+10，2026/9 全程不換夏令時間；Day0/Day1 用台灣 UTC+8 */
function icsEsc(s){ return String(s==null?"":s)
  .replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n") }
/* RFC 5545 §3.1：內容行不得超過 75 octet，續行以單一空白開頭 */
function icsFold(line){
  /* 依「字元」迭代，不是 code unit —— emoji 是代理對，逐 code unit 切會產生孤立代理對 */
  var chars = Array.from ? Array.from(line) : line.split("");
  var out=[], cur="", n=0;
  for(var i=0;i<chars.length;i++){
    var ch=chars[i], w;
    try{ w=unescape(encodeURIComponent(ch)).length }catch(e){ w=4 }
    if(n+w>73){
      out.push(cur);
      /* 折行標記本身就是一個空白；若內容剛好在此處是空白，吞掉它，
         避免解析器移除折行空白後留下多餘空格（RFC 5545 §3.1） */
      if(ch===" "){ cur=" "; n=1 } else { cur=" "+ch; n=1+w }
    } else { cur+=ch; n+=w }
  }
  out.push(cur); return out.join("\r\n");
}
function pad(v){ return (v<10?"0":"")+v }
/* 把某天某時刻換算成 UTC 的 YYYYMMDDTHHMMSSZ */
function icsUTC(dayDate,hm,tzOffsetHours){
  var mo=+dayDate.split("/")[0], da=+dayDate.split("/")[1];
  var h=+hm.split(":")[0], mi=+hm.split(":")[1];
  var t=Date.UTC(2026,mo-1,da,h-tzOffsetHours,mi,0);
  var d=new Date(t);
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+
         pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+"Z";
}
function icsStamp(){ var d=new Date();
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+
         pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+"Z" }
/* UID 唯一：命名空間＋日＋時刻＋序號 */
function icsUID(dayId,i,a){ return "au2026-"+dayId+"-"+i+"-"+a.replace(":","")+"@australia.trip" }
function buildICS(){
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//australia//trip v001//ZH-TW",
         "CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:澳洲 11 天","X-WR-TIMEZONE:Australia/Melbourne"];
  var stamp=icsStamp();
  DAYS.forEach(function(d){
    var tz=dayUsesTW(d.id)?8:10;
    slotsOf(d.id).forEach(function(s,i){
      var st=icsUTC(d.date,s.a,tz);
      var endHM=s.b||s.a;
      /* 跨日（如 20:05 → 07:20）：結束時間落在隔天 */
      var crossDay = mins(endHM)<mins(s.a);
      var da=+d.date.split("/")[1] + (crossDay?1:0);
      var en=icsUTC(d.date.split("/")[0]+"/"+da,endHM,tz);
      if(en===st) en=icsUTC(d.date,fmt(mins(s.a)+30),tz);
      var desc=(s.x||"").replace(/<li>/g,"・").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
      if(s.dead) desc="【死線】"+s.dead+" ／ "+desc;
      L.push("BEGIN:VEVENT");
      L.push("UID:"+icsUID(d.id,i,s.a));
      L.push("DTSTAMP:"+stamp);
      L.push("DTSTART:"+st);
      L.push("DTEND:"+en);
      L.push("SUMMARY:"+icsEsc(s.t));
      if(desc) L.push("DESCRIPTION:"+icsEsc(desc.slice(0,700)));
      if(s.q) L.push("LOCATION:"+icsEsc(s.q));
      if((s.g||[]).length) L.push("CATEGORIES:"+icsEsc(s.g.join(",")));
      if(s.dead){ L.push("BEGIN:VALARM"); L.push("TRIGGER:-PT30M");
        L.push("ACTION:DISPLAY"); L.push("DESCRIPTION:"+icsEsc("30 分鐘後："+s.t)); L.push("END:VALARM") }
      L.push("END:VEVENT");
    });
  });
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n")+"\r\n";
}
function dlICS(){
  var t=buildICS(), b=new Blob([t],{type:"text/calendar;charset=utf-8"});
  var u=URL.createObjectURL(b), a=document.createElement("a");

  if(d.edit){ var s=null; DAYS.forEach(function(dd){ slotsOf(dd.id).forEach(function(x){ if(x._k===d.edit)s=x }) });
    if(!s)return; var a=prompt("開始時間 HH:MM",s.a); if(a===null)return;
    var b=prompt("結束時間 HH:MM",s.b||""); var t=prompt("標題",s.t); if(t===null)return;
    ST.edit[d.edit]=Object.assign({},ST.edit[d.edit],{a:a||s.a,b:b,t:t||s.t}); save(); render(); toast("已改"); return }
  if(d.del){ if(confirm("要刪掉這一格嗎？可以在下面重新加回來")){ ST.hide[d.del]=1; save(); render() } return }
  if(d.add){ var a2=prompt("開始時間 HH:MM","12:00"); if(!a2)return; var t2=prompt("標題"); if(!t2)return;
    ST.adhoc[d.add]=ST.adhoc[d.add]||[]; ST.adhoc[d.add].push({a:a2,b:"",t:t2,g:[],x:"<ul><li>自己加的行程</li></ul>"});
    save(); render(); return }
  if(d.clearlag){ slotsOf(d.clearlag).forEach(function(s){ delete ST.arr[s._k] }); save(); render(); toast("已重設"); return }
  if(d.delx!=null){ ST.exp.splice(+d.delx,1); ST.paid={}; save(); render(); return }
  if(d.paid){ ST.paid[d.paid]=!ST.paid[d.paid]; save(); render(); return }
  if(d.dels!=null){ ST.shop.splice(+d.dels,1); save(); render(); return }
  if(d.delp){ ST.packHide[d.delp]=1; save(); render(); return }
  if(id==="e_add"){
    var ty=document.getElementById("e_type").value, by=+document.getElementById("e_by").value,
        tt=document.getElementById("e_t").value.trim()||"未命名";
    if(ty==="each"){ var ea=[].slice.call(document.querySelectorAll(".e_ea")).map(function(x){return +x.value||0});
      if(!ea.some(function(v){return v>0})){ toast("至少要有一個人的金額"); return }
      ST.exp.push({t:tt,type:"each",by:by,each:ea}) }
    else { var am=+document.getElementById("e_amt").value||0;
      var wi=[].slice.call(document.querySelectorAll(".e_w:checked")).map(function(x){return +x.value});
      if(am<=0){ toast("請填金額"); return } if(!wi.length){ toast("至少要選一個人分攤"); return }
      ST.exp.push({t:tt,type:"even",by:by,amt:am,with:wi}) }
    ST.paid={}; save(); render(); toast("已加入"); return }
  if(id==="s_add"){ var n=document.getElementById("s_n").value.trim(); if(!n){ toast("請填品名"); return }
    ST.shop.push({n:n,price:+document.getElementById("s_p").value||0,w:document.getElementById("s_w").value.trim(),done:false});
    save(); render(); return }
  if(id==="p_add"){ var pn=document.getElementById("p_n").value.trim(); if(!pn)return; ST.pack.push(pn); save(); render(); return }
  if(id==="d_add"){ var dn=document.getElementById("d_n").value.trim(); if(!dn)return;
    if(ST.diet.indexOf(dn)<0)ST.diet.push(dn); save(); render(); return }
  if(id==="rm_new"){ var c="",A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    for(var i=0;i<10;i++)c+=A[Math.floor(Math.random()*A.length)];
    ST.room=c; save(); render(); toast("房號已產生，四支手機都輸入這組"); return }
  if(id==="rm_up"){ ST.room=document.getElementById("rm").value.trim(); save(); fbPush(); return }
  if(id==="rm_dn"){ ST.room=document.getElementById("rm").value.trim(); save(); fbPull(); return }
  if(id==="rm_ck"){ FBST="檢查中…"; render(); fbCheck(function(){ render() }); return }
  if(id==="sc_cp"){ cp(mkSync(),"同步碼"); return }
  if(id==="pc_go"){ applyCode(document.getElementById("pc").value); return }
  if(id==="ics_dl"){ dlICS(); return }
  if(id==="bk_cp"){ cp(mkBackup(),"備份碼"); return }
  if(id==="bk_dl"){ var b=new Blob([mkBackup()],{type:"text/plain"}),u=URL.createObjectURL(b),a3=document.createElement("a");
    a3.href=u; a3.download="australia-backup-"+new Date().toISOString().slice(0,10)+".txt"; a3.click();
    setTimeout(function(){URL.revokeObjectURL(u)},1000); toast("備份檔已下載"); return }
  if(id==="bk_sh"){ if(navigator.share) navigator.share({title:"澳洲 11 天 備份",text:mkBackup()}).catch(function(){});
    else cp(mkBackup(),"備份碼"); return }
});
function cp(t,n){ if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(function(){toast(n+"已複製")},function(){prompt("手動複製",t)});
  else prompt("手動複製",t) }
document.addEventListener("change",function(ev){
  var el=ev.target,d=el.dataset;
  if(el.id==="e_type"){ var ea=el.value==="each";
    document.getElementById("e_each").style.display=ea?"block":"none";
    document.getElementById("e_even").style.display=ea?"none":"block"; return }
  if(el.id==="b_v"){ ST.budget=+el.value||0; save(); render(); return }
  if(el.classList.contains("s_ck")){ ST.shop[+d.i].done=el.checked; save(); render(); return }
  if(el.classList.contains("p_ck")){ ST.done["pk|"+d.k]=el.checked; save(); render(); return }
  if(el.classList.contains("m_n")){ ST.members[+d.i]=el.value.trim(); save(); return }
  if(el.classList.contains("d_ck")){ var v=el.value,i=ST.dietOn.indexOf(v);
    if(el.checked){ if(i<0)ST.dietOn.push(v) } else if(i>=0)ST.dietOn.splice(i,1); save(); return }
  if(el.classList.contains("m_a")){ var f=el.files&&el.files[0]; if(!f)return;
    var r=new FileReader(); r.onload=function(){ var img=new Image();
      img.onload=function(){ var c=document.createElement("canvas"),S2=120; c.width=c.height=S2;
        var x=c.getContext("2d"),mn=Math.min(img.width,img.height);
        x.drawImage(img,(img.width-mn)/2,(img.height-mn)/2,mn,mn,0,0,S2,S2);
        ST.avatars[+d.i]=c.toDataURL("image/jpeg",.75); save(); render() };
      img.src=r.result }; r.readAsDataURL(f); return }
});
/* ===== 啟動 ===== */
applyFS(); renderNav(); render(); tick(); setInterval(tick,20000); setInterval(render,60000);
fbCheck(function(){ if(ST.tab==="share")render() });
if("serviceWorker" in navigator){ window.addEventListener("load",function(){
  navigator.serviceWorker.register("sw.js").catch(function(){}) }) }
</script>
