:root{
  --paper:#F2F4F3; --paper2:#E7EBE9; --ink:#16211E; --ink2:#4A5B55; --dim:#7C8C86;
  --line:#CFD8D4; --go:#1F6F5C; --go-d:#175443; --red:#B3261E; --red-bg:#FBEAE8;
  --gold:#C8842B; --sea:#24608C; --white:#FFFFFF;
  --sp:16px; --r:10px;
  --fs:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:var(--fs); line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--sea)}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── 頂部 ── */
header{position:sticky;top:0;z-index:40;background:var(--ink);color:var(--paper);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.hrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:8px}
.hrow h1{font-size:1.02em}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:.86em;color:#B9C7C2}
.clock b{color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:20px;
  background:#2B3A35;color:#C9D6D1;font-size:.85em;white-space:nowrap}
nav button.on{background:var(--paper);color:var(--ink);font-weight:700}
nav button{position:relative}
nav button.today{background:var(--gold);color:#2A1B05;font-weight:700}
nav button.today.on{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold)}
nav button.dl::after{content:"";position:absolute;top:7px;right:8px;width:6px;height:6px;
  border-radius:50%;background:var(--red)}
nav button.dl{padding-right:20px}

/* ── 內容 ── */
main{padding:var(--sp) 14px 90px;max-width:720px;margin:0 auto}
.dayhead{margin-bottom:14px}
.dayhead .dt{font-size:.78em;color:var(--dim);font-variant-numeric:tabular-nums}
.dayhead h2{font-size:1.55em;line-height:1.24;margin:3px 0 5px;letter-spacing:-.025em;
  text-wrap:balance;word-break:break-word}
.dayhead h2.long{font-size:1.24em;line-height:1.3;letter-spacing:-.01em}
.dayhead .sub{font-size:.85em;color:var(--ink2)}

/* ── 時間軸 ── */
.rail{position:relative;padding-left:18px}
.rail::before{content:"";position:absolute;left:4px;top:14px;bottom:14px;width:2px;background:var(--line)}
.slot{position:relative;padding:16px 0 18px}
.slot::before{content:"";position:absolute;left:-18px;top:22px;width:10px;height:10px;
  border-radius:50%;background:var(--paper);box-shadow:0 0 0 2px var(--go)}
.slot.dead::before{background:var(--red);box-shadow:0 0 0 2px var(--red)}
.slot.dead{background:var(--red-bg);margin:0 -12px 0 -12px;padding:16px 12px 18px 12px;border-radius:var(--r)}
.slot.dead::before{left:-6px}
.tm{font-variant-numeric:tabular-nums;font-size:.82em;color:var(--dim);letter-spacing:.02em}
.tm b{font-size:.94em;color:var(--ink)}
.tm .shift{color:var(--red);font-weight:700}
.st{font-size:1.1em;font-weight:700;line-height:1.38;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0 0}
.tag{font-size:.76em;padding:3px 8px;border-radius:5px;background:var(--paper2);color:var(--ink2)}
.tag.t-warn{background:var(--red);color:#fff;font-weight:700}
.tag.t-open{background:#DEF0E8;color:var(--go-d);font-weight:700}
.tag.t-soon{background:#FDF0DC;color:#8A5A12;font-weight:700}
.tag.t-shut{background:var(--red-bg);color:var(--red);font-weight:700}
.x{margin:10px 0 0;font-size:.95em;line-height:1.7;color:var(--ink2)}
.x ul{margin:0;padding-left:19px}
.x li{margin:4px 0}
.x b{color:var(--ink)}
.deadline{margin:10px 0 0;font-size:.9em;font-weight:700;color:var(--red)}
.arrived{margin:9px 0 0;font-size:.82em;color:var(--go-d);font-weight:700}

/* ── 按鈕列 ── */
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;align-items:center}
.btn{min-height:44px;padding:0 14px;border-radius:9px;font-size:.88em;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ico{width:48px;padding:0;font-size:1.05em}
.btn.go{background:var(--go);color:#fff}
.btn.sec{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.on{background:var(--go-d);color:#fff}
.more{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 0}
.more button,.more a{min-height:36px;padding:0 12px;border-radius:6px;font-size:.82em;
  background:var(--paper2);color:var(--ink2);display:inline-flex;align-items:center;text-decoration:none}
details{margin:9px 0 0}
details summary{min-height:34px;display:flex;align-items:center;

details .body{font-size:.92em;color:var(--ink2);padding:6px 0 0;line-height:1.65}
details ol{margin:0;padding-left:20px}
details li{margin:5px 0}

/* ── 通用區塊 ── */
.card{background:var(--white);border-radius:var(--r);padding:14px;margin:0 0 12px;
  box-shadow:inset 0 0 0 1px var(--line)}
.card h3{font-size:1.02em;margin:0 0 8px}
.note{font-size:.92em;color:var(--ink2);line-height:1.7}
.warn{background:var(--red-bg);box-shadow:inset 0 0 0 1px #E9C4C0}
.warn h3{color:var(--red)}
.ok{background:#E4F1EB;box-shadow:inset 0 0 0 1px #B9D9CC}
.sec-t{font-size:.8em;color:var(--dim);margin:20px 0 8px;font-weight:700}
.empty{text-align:center;padding:26px 16px}
.empty b{display:block;font-size:1.05em;margin-bottom:5px}
table{width:100%;border-collapse:collapse;font-size:.92em}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td:first-child{padding-right:10px}
.card.warn td:first-child{min-width:min(8.2em,42vw)}
table{table-layout:fixed}
td,th{overflow-wrap:anywhere;word-break:break-word}

th{color:var(--dim);font-weight:700;font-size:.85em}
input,select,textarea{font-family:inherit;font-size:16px;padding:10px;border-radius:8px;

.av.sm{width:30px;height:30px;font-size:.78em}

.paid{opacity:.45;text-decoration:line-through}

.fsbar button.on{background:var(--paper);color:var(--ink)}

.tel{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;

.tel.urgent{background:var(--red);color:#fff;box-shadow:none;font-size:1.05em}
td .tel{margin:2px 0}
/* 勾選晶片 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;

.chip input{width:18px;height:18px;margin:0;flex:0 0 auto}
.chip.on{background:#DEF0E8;box-shadow:inset 0 0 0 2px var(--go)}
/* 檔案上傳 */
.file{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:9px;
  background:var(--paper2);color:var(--ink2);font-size:.85em;font-weight:700;cursor:pointer;white-space:nowrap}
.file input{display:none}
/* 大頭貼：名字移到圈外 */
.avwrap{display:flex;align-items:center;gap:9px;flex:0 0 auto;min-width:7.4em}
.avwrap .nm{font-size:.85em;color:var(--ink2)}
.av{width:44px;height:44px;font-size:1em}
.av .n{display:none}
/* 備案分組 */

.plan.hot{box-shadow:inset 0 0 0 1px #E9C4C0;background:var(--red-bg)}

</style>

 {a:"11:15",b:"12:45",t:"🪨 十二門徒石",g:["🕐 約 90 分鐘","💴 直升機自費 AU$195／成人"],x:"<ul><li>直升機當天跟導遊訂</li><li>🚨 <b>沒有遮蔽的海崖，風很大</b>。帽子要能綁住或收進包包，會被直接吹走</li><li>海岸紫外線反射強，防曬要擦</li></ul>",q:"Twelve Apostles Great Ocean Road",
  photo:"🚨 <b>現存只有 7 根</b>，名字叫十二門徒但不是十二根。<br>主觀景台往<b>西</b>看能一次帶到最多根石柱。<br>從停車場要走一段步道穿過公路下方的地道才到觀景台，<b>時間要抓進 90 分鐘裡</b>。<br>海崖沒有遮蔽、風極大，<b>帽子要能綁住或收起來</b>，手機握緊。"},
 {a:"12:55",b:"13:25",t:"🌊 洛克阿德峽谷",g:["🕐 約 30 分鐘","🚨 有階梯要走"],x:"<ul><li>名字來自 1878 年在此觸礁的鐵殼船 Loch Ard，船上只有兩人生還，兩人就是漂到這個峽谷上岸的</li><li>石灰岩被海水掏空形成的內凹海灣，兩側是垂直峭壁</li><li>🚨 <b>要走一段木階梯下到沙灘再走回來</b>，30 分鐘扣掉上下階梯的時間並不寬裕</li><li>階梯可能濕滑，<b>穿好走的鞋</b></li><li>不下沙灘的話，上方的觀景平台也看得到全景</li></ul>",q:"Loch Ard Gorge",
  photo:"<b>從上方觀景台拍全景</b>——能同時帶到兩側峭壁與中間的沙灘，這是明信片角度。<br>下到沙灘後往回拍，峭壁的高度才有壓迫感。<br>海風大，<b>手機用手腕帶或握緊</b>。"},

 {a:"15:40",b:"16:00",t:"🏖️ 阿波羅灣",g:["🕐 約 20 分鐘","🌬️ 風大"],x:"<ul><li>大洋路上的漁港小鎮，半月形海灣，背後是奧特威山脈</li><li>只停 20 分鐘，<b>下車就是拍照與伸展腿</b>，不夠時間走到海灘再走回來</li><li>鎮上主街有咖啡與冰淇淋店</li><li>🚨 空曠海邊，<b>帽子會被吹走</b></li></ul>",q:"Apollo Bay Victoria"},
 {a:"17:10",b:"17:20",t:"📸 大洋路紀念門牌",g:["🕐 只停 10 分鐘"],x:"<ul><li>Memorial Arch，紀念一次大戰後修築這條路的三千名退伍軍人——大洋路本身就是世界最大的戰爭紀念物</li><li>🚨 <b>只停 10 分鐘，下車就拍，不要先上廁所</b></li><li>木造拱門橫跨公路，旁邊有紀念雕像</li></ul>",q:"Great Ocean Road Memorial Arch",
  photo:"<b>站在公路中線往拱門拍</b>能拍到門framing 整條路，但<b>要注意來車</b>，有人在旁邊看車。<br>四個人一起站在拱門下是最常見的合照角度。<br>17:10 的九月澳洲天色開始轉暗，<b>光線偏暖，順光在拱門的西側</b>。"},

function mkSync(){ return LG_PREFIX+b64e({exp:ST.exp,paid:ST.paid,shop:ST.shop,budget:ST.budget,
  members:ST.members,arr:ST.arr,edit:ST.edit,adhoc:ST.adhoc,hide:ST.hide,done:ST.done,pack:ST.pack,packHide:ST.packHide}) }
function readCode(c){
  c=(c||"").trim();
  if(!c) return {ok:false,msg:"請先貼上代碼"};
  /* AUBK 與 AULG 等長且不互為前綴，但仍明確互擋，給清楚指引 */
  if(c.indexOf(BK_PREFIX)===0){
    try{ return {ok:true,kind:"backup",data:b64d(c.slice(BK_PREFIX.length))} }
    catch(e){ return {ok:false,msg:"備份代碼看起來不完整，請重新複製整段"} } }
  if(c.indexOf(LG_PREFIX)===0){
    try{ return {ok:true,kind:"sync",data:b64d(c.slice(LG_PREFIX.length))} }
    catch(e){ return {ok:false,msg:"同步代碼看起來不完整，請重新複製整段"} } }
  return {ok:false,msg:"這不是本 App 的代碼。備份碼以 "+BK_PREFIX+" 開頭，同步碼以 "+LG_PREFIX+" 開頭"};
}
function applyCode(c){
  var r=readCode(c); if(!r.ok){ toast(r.msg); return }
  if(r.kind==="backup"){
    if(!confirm("還原備份會覆蓋這支手機上的所有資料，確定？")){ toast("已取消，沒有變更任何資料"); return }
    ST=Object.assign(ST,r.data); save(); render(); toast("已還原備份"); return }
  merge(r.data); save(); render(); toast("已合併同步資料");
}
/* 合併：不比較兩支手機的時戳；我 90 秒內剛改過就留我的 */
function merge(rm){
  if(!rm||typeof rm!=="object") return;
  var mine=(Date.now()-(ST.lastEdit||0))<90000;
  ["exp","shop","pack"].forEach(function(k){ if(Array.isArray(rm[k])&&!mine) ST[k]=rm[k] });
  ["paid","arr","edit","adhoc","hide","done","packHide"].forEach(function(k){
    if(rm[k]&&typeof rm[k]==="object"){ if(mine) ST[k]=Object.assign({},rm[k],ST[k]); else ST[k]=Object.assign({},ST[k],rm[k]) } });
  if(Array.isArray(rm.members)&&!mine) ST.members=rm.members;
  if(typeof rm.budget==="number"&&!mine) ST.budget=rm.budget;
}
/* ===== Firebase 即時同步 ===== */
var FBST="檢查中…";
function fbURL(){ return FB_DB.replace(/\/$/,"")+"/"+FB_PATH+"/"+encodeURIComponent(ST.room)+".json" }
function fbCheck(cb){
  if(!FB_DB){ FBST="⚪ 未設定 Firebase，只用同步碼"; cb&&cb(); return }
  var room=ST.room||"PROBE00000";
  fetch(FB_DB.replace(/\/$/,"")+"/"+FB_PATH+"/"+room+".json",{cache:"no-store"})
   .then(function(r){ return r.text().then(function(t){ return {s:r.status,t:t} }) })
   .then(function(o){
     if(o.s===200) FBST="🟢 即時同步正常";
     else if(/Permission denied/i.test(o.t)) FBST="🔴 資料庫規則沒設對（見下方 JSON）";
     else FBST="🟠 Firebase 回應 "+o.s+"："+o.t.slice(0,80);
     cb&&cb() })
   .catch(function(){ FBST="⚪ 目前離線，用同步碼"; cb&&cb() });
}
function fbPush(){ if(!FB_DB||!ST.room){ toast("先產生房號"); return }
  fetch(fbURL(),{method:"PUT",body:JSON.stringify({d:mkSync(),at:Date.now()})})
   .then(function(r){ toast(r.ok?"已上傳到房間":"上傳失敗，改用同步碼") })
   .catch(function(){ toast("目前離線，改用同步碼") }) }
function fbPull(){ if(!FB_DB||!ST.room){ toast("先產生房號"); return }
  fetch(fbURL(),{cache:"no-store"}).then(function(r){return r.json()})
   .then(function(j){ if(j&&j.d){ applyCode(j.d) } else toast("房間裡還沒有資料") })
   .catch(function(){ toast("目前離線，改用同步碼") }) }

/* ===== ICS 匯出（RFC 5545） ===== */
/* 澳洲東部標準時間 UTC+10，2026/9 全程不換夏令時間；Day0/Day1 用台灣 UTC+8 */
function icsEsc(s){ return String(s==null?"":s)
  .replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n") }
/* RFC 5545 §3.1：內容行不得超過 75 octet，續行以單一空白開頭 */
function icsFold(line){
  /* 依「字元」迭代，不是 code unit —— emoji 是代理對，逐 code unit 切會產生孤立代理對 */
  var chars = Array.from ? Array.from(line) : line.split("");
  var out=[], cur="", n=0;
  for(var i=0;i<chars.length;i++){
    var ch=chars[i], w;
    try{ w=unescape(encodeURIComponent(ch)).length }catch(e){ w=4 }
    if(n+w>73){
      out.push(cur);
      /* 折行標記本身就是一個空白；若內容剛好在此處是空白，吞掉它，
         避免解析器移除折行空白後留下多餘空格（RFC 5545 §3.1） */
      if(ch===" "){ cur=" "; n=1 } else { cur=" "+ch; n=1+w }
    } else { cur+=ch; n+=w }
  }
  out.push(cur); return out.join("\r\n");
}
function pad(v){ return (v<10?"0":"")+v }
/* 把某天某時刻換算成 UTC 的 YYYYMMDDTHHMMSSZ */
function icsUTC(dayDate,hm,tzOffsetHours){
  var mo=+dayDate.split("/")[0], da=+dayDate.split("/")[1];
  var h=+hm.split(":")[0], mi=+hm.split(":")[1];
  var t=Date.UTC(2026,mo-1,da,h-tzOffsetHours,mi,0);
  var d=new Date(t);
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+
         pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+"Z";
}
function icsStamp(){ var d=new Date();
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+
         pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+"Z" }
/* UID 唯一：命名空間＋日＋時刻＋序號 */
function icsUID(dayId,i,a){ return "au2026-"+dayId+"-"+i+"-"+a.replace(":","")+"@australia.trip" }
function buildICS(){
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//australia//trip v001//ZH-TW",
         "CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:澳洲 11 天","X-WR-TIMEZONE:Australia/Melbourne"];
  var stamp=icsStamp();
  DAYS.forEach(function(d){
    var tz=dayUsesTW(d.id)?8:10;
    slotsOf(d.id).forEach(function(s,i){
      var st=icsUTC(d.date,s.a,tz);
      var endHM=s.b||s.a;
      /* 跨日（如 20:05 → 07:20）：結束時間落在隔天 */
      var crossDay = mins(endHM)<mins(s.a);
      var da=+d.date.split("/")[1] + (crossDay?1:0);
      var en=icsUTC(d.date.split("/")[0]+"/"+da,endHM,tz);
      if(en===st) en=icsUTC(d.date,fmt(mins(s.a)+30),tz);
      var desc=(s.x||"").replace(/<li>/g,"・").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
      if(s.dead) desc="【死線】"+s.dead+" ／ "+desc;
      L.push("BEGIN:VEVENT");
      L.push("UID:"+icsUID(d.id,i,s.a));
      L.push("DTSTAMP:"+stamp);
      L.push("DTSTART:"+st);
      L.push("DTEND:"+en);
      L.push("SUMMARY:"+icsEsc(s.t));
      if(desc) L.push("DESCRIPTION:"+icsEsc(desc.slice(0,700)));
      if(s.q) L.push("LOCATION:"+icsEsc(s.q));
      if((s.g||[]).length) L.push("CATEGORIES:"+icsEsc(s.g.join(",")));
      if(s.dead){ L.push("BEGIN:VALARM"); L.push("TRIGGER:-PT30M");
        L.push("ACTION:DISPLAY"); L.push("DESCRIPTION:"+icsEsc("30 分鐘後："+s.t)); L.push("END:VALARM") }
      L.push("END:VEVENT");
    });
  });
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n")+"\r\n";
}
function dlICS(){
  var t=buildICS(), b=new Blob([t],{type:"text/calendar;charset=utf-8"});
  var u=URL.createObjectURL(b), a=document.createElement("a");
  a.href=u; a.download="australia-2026.ics"; a.click();
  setTimeout(function(){ URL.revokeObjectURL(u) },1000);
  toast("行事曆檔已下載，用行事曆 App 開啟即可匯入");
}

 45:["🌫️","有霧"],48:["🌫️","霧淞"],51:["🌦️","毛毛雨"],53:["🌦️","毛毛雨"],55:["🌧️","毛毛雨(強)"],

function wxDesc(c){ return WMO[c]||["🌡️","—"] }
function loadWX(cb){
  var done=0;
  Object.keys(CITY).forEach(function(k){
    var c=CITY[k];
    var u="https://api.open-meteo.com/v1/forecast?latitude="+c.lat+"&longitude="+c.lon+
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max"+
      "&timezone=Australia%2FMelbourne&forecast_days=7";
    fetch(u).then(function(r){return r.json()}).then(function(j){
      if(j&&j.daily) WX[k]=j.daily; done++; if(done===2){WX.at=Date.now();cb&&cb()} })
     .catch(function(){ WX.err="離線，顯示上次取得的資料"; done++; if(done===2)cb&&cb() });
  });
}
function wxCard(){
  if(!WX.mel&&!WX.syd) return '<div class="card"><h3>🌤️ 天氣</h3><div class="note">'+
    (WX.err||"讀取中…")+'　<button class="btn sec" id="wx_go" style="margin-top:8px">重新讀取</button></div></div>';
  function rows(k){
    var d=WX[k]; if(!d) return "";
    return '<div class="sec-t">'+CITY[k].n+'</div><table>'+d.time.slice(0,5).map(function(t,i){
      var w=wxDesc(d.weather_code[i]), p=d.precipitation_probability_max[i], uv=d.uv_index_max[i];
      var md=t.slice(5).replace("-","/");
      return '<tr><td class="mono">'+md+'</td><td>'+w[0]+' '+w[1]+'</td>'+
        '<td class="mono">'+Math.round(d.temperature_2m_min[i])+'–'+Math.round(d.temperature_2m_max[i])+'°C</td>'+
        '<td class="mono">'+(p!=null?'💧'+p+'%':'')+(uv!=null&&uv>=3?'　☀️UV'+Math.round(uv):'')+'</td></tr>';
    }).join("")+'</table>';
  }
  return '<div class="card"><h3>🌤️ 未來五天</h3>'+rows("mel")+rows("syd")+
   '<div class="note" style="margin-top:8px">'+(WX.err||"資料來源 Open-Meteo")+
   '　<b>UV 3 以上就要防曬</b>。墨爾本一天可以變四次，出門帶薄外套與傘。</div>'+

/* ===== 版本與更新 ===== */
var APP_VER="008";
var UPD={latest:null,checking:false,err:""};
function checkUpdate(cb){
  if(UPD.checking){cb&&cb();return}
  UPD.checking=true; UPD.err="";
  fetch("./index.html?v="+Date.now(),{cache:"no-store"})
   .then(function(r){ return r.text() })
   .then(function(t){
     var m=t.match(/<title>[^<]*?v(\d{3})<\/title>/);
     UPD.latest=m?m[1]:null; UPD.checking=false; cb&&cb();
   })
   .catch(function(){ UPD.err="目前離線，無法檢查"; UPD.checking=false; cb&&cb() });
}
function hasUpdate(){ return UPD.latest && UPD.latest!==APP_VER }
function doUpdate(){
  /* 🚨 絕對不能先刪快取再抓 —— 離線時按下去會把 App 清成空白且救不回來。
     必須先確認網路上抓得到完整的新版，成功之後才動快取。 */
  if(navigator.onLine===false){ toast("目前離線，連上網路後再更新"); return }
  toast("更新中，請稍候…");
  fetch("./index.html?v="+Date.now(),{cache:"no-store"})
   .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text() })
   .then(function(t){
     if(t.length<20000||t.indexOf("</html>")<0) throw new Error("下載不完整");
     var jobs=[];
     if(window.caches&&caches.keys) jobs.push(caches.keys().then(function(ks){
       /* 只刪自己命名空間的快取，不碰同 origin 的其他專案 */
       return Promise.all(ks.filter(function(k){return k.indexOf("australia-")===0})
         .map(function(k){ return caches.delete(k) })) }));
     if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
       jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
         return Promise.all(rs.map(function(r){ return r.update().catch(function(){}) })) }));
     return Promise.all(jobs).catch(function(){});
   })
   .then(function(){ setTimeout(function(){ location.reload() },400) })
   .catch(function(e){
     toast("更新失敗："+(e&&e.message||"網路不穩")+"。原本的版本仍可正常使用");
   });
}
function updBanner(){
  if(hasUpdate()) return '<div class="card warn"><h3>🔄 有新版本 v'+esc(UPD.latest)+'</h3>'+
    '<div class="note">你目前是 <b>v'+APP_VER+'</b>。更新<b>不會刪掉任何資料</b>——'+
    '分帳、購物清單、房號、成員名字與照片都會保留。</div>'+
    '<div class="acts"><button class="btn go" id="upd_go">立即更新</button></div></div>';
  return "";
}
function verCard(){
  return '<div class="card"><h3>📦 版本</h3><div class="note">'+
   '目前使用 <b>v'+APP_VER+'</b>'+
   (UPD.checking? '　檢查中…' : UPD.err? '　'+esc(UPD.err) :
     UPD.latest? (hasUpdate()? '　<b style="color:var(--red)">線上已有 v'+esc(UPD.latest)+'</b>' : '　✅ 已是最新版')
     : '')+
   '<br><br><b>App 會自己檢查更新，你不用主動按。</b>開啟時、從背景切回來時、網路恢復時，以及每 30 分鐘各檢查一次；有新版會直接在畫面最上方跳出橫幅。<br>更新不用刪除重裝，'+
   '所有資料存在這支手機上，更新、重整、關閉 App 都不會消失。'+
   '<br>只有<b>手動刪除 App</b> 或清除瀏覽器資料才會清空——那之前記得先到「分享」頁複製備份碼。</div>'+
   '<div class="acts"><button class="btn sec" id="upd_ck">手動檢查</button>'+
   (hasUpdate()?'<button class="btn go" id="upd_go">立即更新</button>':'')+'</div></div>';
}
/* ===== 朗讀 ===== */
function say(txt,lang){
  if(!("speechSynthesis" in window)){ toast("這支手機不支援朗讀"); return }
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(txt); u.lang=lang||"zh-TW"; u.rate=.95;
  speechSynthesis.speak(u);
}
function sayerSlot(k){
  var s=null; DAYS.forEach(function(d){ slotsOf(d.id).forEach(function(x){ if(x._k===k)s=x }) });
  if(!s)return;
  var t=s.a+" 到 "+(s.b||"")+"，"+s.t+"。";
  (s.g||[]).forEach(function(g){ t+=g.replace(/[🕐🚨💴✅⚠️👔]/g,"")+"。" });
  if(s.dead) t+="死線："+s.dead+"。";
  var plain=(s.x||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
  t+=plain.slice(0,300);
  say(t);
}
/* ===== 主渲染 ===== */
function render(){
  applyFS(); renderNav(); renderFS();
  var k=ST.tab,h="";
  if(k==="help")h=renderHelp();
  else if(/^d\d+$/.test(k))h=renderDay(k);
  else if(k==="split")h=renderSplit();
  else if(k==="shop")h=renderShop();
  else if(k==="pack")h=renderPack();
  else if(k==="info")h=renderInfo();
  else if(k==="sos")h=renderSOS();
  else if(k==="plan")h=renderPlan();
  else if(k==="share")h=renderShare();
  else if(k==="prep")h=renderPrep();
  document.getElementById("main").innerHTML=updBanner()+h;
  var t=document.querySelector("nav button.on"); if(t)t.scrollIntoView({block:"nearest",inline:"center"});
}
function applyFS(){
  var b=document.body; if(!b)return;
  b.className=(b.className||"").replace(/\bfs-\w+\b/g,"").trim()+" fs-"+(ST.fs||"m");
}
function renderFS(){
  var el=document.getElementById("fsbar"); if(!el)return;
  el.innerHTML=[["s","小"],["m","中"],["l","大"],["xl","特大"]].map(function(o){
    return '<button class="'+(ST.fs===o[0]?"on":"")+'" data-fs="'+o[0]+'" aria-label="文字'+o[1]+'">'+o[1]+'</button>';
  }).join("");
}
function tick(){ var n=auNow();
  document.getElementById("clk").innerHTML='澳洲 <b>'+fmt(auMins())+'</b>　台灣 '+
    fmt(twNow().getHours()*60+twNow().getMinutes()); }
/* ===== 事件 ===== */
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-fs],[data-tab],[data-nav],[data-say],[data-sayen],[data-arr],[data-mo],"+
    "[data-edit],[data-del],[data-remind],[data-add],[data-clearlag],[data-delx],[data-paid],"+
    "[data-dels],[data-delp],#e_add,#s_add,#p_add,#d_add,#rm_new,#rm_up,#rm_dn,#rm_ck,#sc_cp,#pc_go,#bk_cp,#bk_dl,#bk_sh,#ics_dl,#wx_go,#fx_go,#upd_ck,#upd_go");
  if(!el)return;
  var d=el.dataset,id=el.id;
  if(id==="upd_ck"){ UPD.checking=true; render(); checkUpdate(function(){ render();
    toast(hasUpdate()? "有新版本 v"+UPD.latest : (UPD.err||"已是最新版")) }); return }
  if(id==="upd_go"){ doUpdate(); return }
  if(id==="wx_go"){ WX.err="讀取中…"; render(); loadWX(function(){ render() }); return }
  if(id==="fx_go"){ FX.err="讀取中…"; render(); loadFX(function(){ render() }); return }
  if(d.fs){ ST.fs=d.fs; save(); applyFS(); renderFS(); toast("文字大小已調整"); return }
  if(d.tab){ go(d.tab); return }
  if(d.nav){ window.open("https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(d.nav),"_blank"); return }
  if(d.say){ sayerSlot(d.say); return }
  if(d.sayen){ say(d.sayen,"en-AU"); return }
  if(d.arr){ if(ST.arr[d.arr]!=null) delete ST.arr[d.arr]; else ST.arr[d.arr]=nowFor(ST.tab); save(); render(); return }
  if(d.mo){ var m=document.getElementById("mo_"+d.mo); if(m)m.style.display=m.style.display==="none"?"block":"none"; return }
  if(d.remind){ toast("請用手機內建鬧鐘設定。這個 App 離線時無法主動推播。"); return }
  if(d.edit){ var s=null; DAYS.forEach(function(dd){ slotsOf(dd.id).forEach(function(x){ if(x._k===d.edit)s=x }) });
    if(!s)return; var a=prompt("開始時間 HH:MM",s.a); if(a===null)return;
    var b=prompt("結束時間 HH:MM",s.b||""); var t=prompt("標題",s.t); if(t===null)return;
    ST.edit[d.edit]=Object.assign({},ST.edit[d.edit],{a:a||s.a,b:b,t:t||s.t}); save(); render(); toast("已改"); return }
  if(d.del){ if(confirm("要刪掉這一格嗎？可以在下面重新加回來")){ ST.hide[d.del]=1; save(); render() } return }
  if(d.add){ var a2=prompt("開始時間 HH:MM","12:00"); if(!a2)return; var t2=prompt("標題"); if(!t2)return;
    ST.adhoc[d.add]=ST.adhoc[d.add]||[]; ST.adhoc[d.add].push({a:a2,b:"",t:t2,g:[],x:"<ul><li>自己加的行程</li></ul>"});
    save(); render(); return }
  if(d.clearlag){ slotsOf(d.clearlag).forEach(function(s){ delete ST.arr[s._k] }); save(); render(); toast("已重設"); return }
  if(d.delx!=null){ ST.exp.splice(+d.delx,1); ST.paid={}; save(); render(); return }
  if(d.paid){ ST.paid[d.paid]=!ST.paid[d.paid]; save(); render(); return }
  if(d.dels!=null){ ST.shop.splice(+d.dels,1); save(); render(); return }
  if(d.delp){ ST.packHide[d.delp]=1; save(); render(); return }
  if(id==="e_add"){
    var ty=document.getElementById("e_type").value, by=+document.getElementById("e_by").value,
        tt=document.getElementById("e_t").value.trim()||"未命名";
    if(ty==="each"){ var ea=[].slice.call(document.querySelectorAll(".e_ea")).map(function(x){return +x.value||0});
      if(!ea.some(function(v){return v>0})){ toast("至少要有一個人的金額"); return }
      ST.exp.push({t:tt,type:"each",by:by,each:ea}) }
    else { var am=+document.getElementById("e_amt").value||0;
      var wi=[].slice.call(document.querySelectorAll(".e_w:checked")).map(function(x){return +x.value});
      if(am<=0){ toast("請填金額"); return } if(!wi.length){ toast("至少要選一個人分攤"); return }
      ST.exp.push({t:tt,type:"even",by:by,amt:am,with:wi}) }
    ST.paid={}; save(); render(); toast("已加入"); return }
  if(id==="s_add"){ var n=document.getElementById("s_n").value.trim(); if(!n){ toast("請填品名"); return }
    ST.shop.push({n:n,price:+document.getElementById("s_p").value||0,w:document.getElementById("s_w").value.trim(),done:false});
    save(); render(); return }
  if(id==="p_add"){ var pn=document.getElementById("p_n").value.trim(); if(!pn)return; ST.pack.push(pn); save(); render(); return }
  if(id==="d_add"){ var dn=document.getElementById("d_n").value.trim(); if(!dn)return;
    if(ST.diet.indexOf(dn)<0)ST.diet.push(dn); save(); render(); return }
  if(id==="rm_new"){ var c="",A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    for(var i=0;i<10;i++)c+=A[Math.floor(Math.random()*A.length)];
    ST.room=c; save(); render(); toast("房號已產生，四支手機都輸入這組"); return }
  if(id==="rm_up"){ ST.room=document.getElementById("rm").value.trim(); save(); fbPush(); return }
  if(id==="rm_dn"){ ST.room=document.getElementById("rm").value.trim(); save(); fbPull(); return }
  if(id==="rm_ck"){ FBST="檢查中…"; render(); fbCheck(function(){ render() }); return }
  if(id==="sc_cp"){ cp(mkSync(),"同步碼"); return }
  if(id==="pc_go"){ applyCode(document.getElementById("pc").value); return }
  if(id==="ics_dl"){ dlICS(); return }
  if(id==="bk_cp"){ cp(mkBackup(),"備份碼"); return }
  if(id==="bk_dl"){ var b=new Blob([mkBackup()],{type:"text/plain"}),u=URL.createObjectURL(b),a3=document.createElement("a");
    a3.href=u; a3.download="australia-backup-"+new Date().toISOString().slice(0,10)+".txt"; a3.click();
    setTimeout(function(){URL.revokeObjectURL(u)},1000); toast("備份檔已下載"); return }
  if(id==="bk_sh"){ if(navigator.share) navigator.share({title:"澳洲 11 天 備份",text:mkBackup()}).catch(function(){});
    else cp(mkBackup(),"備份碼"); return }
});
function cp(t,n){ if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(function(){toast(n+"已複製")},function(){prompt("手動複製",t)});
  else prompt("手動複製",t) }
document.addEventListener("input",function(ev){
  if(ev.target.id==="fx_a"){
    var v=parseFloat(ev.target.value), t=document.getElementById("fx_t");
    if(t) t.textContent=(FX.rate&&!isNaN(v))? "NT$"+Math.round(v*FX.rate).toLocaleString() : "—";
  }
});
document.addEventListener("change",function(ev){
  var el=ev.target,d=el.dataset;
  if(el.id==="e_type"){ var ea=el.value==="each";
    document.getElementById("e_each").style.display=ea?"block":"none";
    document.getElementById("e_even").style.display=ea?"none":"block"; return }
  if(el.id==="b_v"){ ST.budget=+el.value||0; save(); render(); return }
  if(el.classList.contains("s_ck")){ ST.shop[+d.i].done=el.checked; save(); render(); return }
  if(el.classList.contains("p_ck")){ ST.done["pk|"+d.k]=el.checked; save(); render(); return }
  if(el.classList.contains("m_n")){ ST.members[+d.i]=el.value.trim(); save(); return }
  if(el.classList.contains("d_ck")){ var v=el.value,i=ST.dietOn.indexOf(v);
    if(el.checked){ if(i<0)ST.dietOn.push(v) } else if(i>=0)ST.dietOn.splice(i,1); save(); return }
  if(el.classList.contains("m_a")){ var f=el.files&&el.files[0]; if(!f)return;
    var r=new FileReader(); r.onload=function(){ var img=new Image();
      img.onload=function(){ var c=document.createElement("canvas"),S2=120; c.width=c.height=S2;
        var x=c.getContext("2d"),mn=Math.min(img.width,img.height);
        x.drawImage(img,(img.width-mn)/2,(img.height-mn)/2,mn,mn,0,0,S2,S2);
        ST.avatars[+d.i]=c.toDataURL("image/jpeg",.75); save(); render() };
      img.src=r.result }; r.readAsDataURL(f); return }
});
/* ===== 啟動 ===== */
applyFS(); renderNav(); render(); tick(); setInterval(tick,20000); setInterval(render,60000);
fbCheck(function(){ if(ST.tab==="share")render() });
try{ var _fx=JSON.parse(localStorage.getItem(LSKEY+"_fx")||"null"); if(_fx)FX=_fx }catch(e){}
loadWX(function(){ if(ST.tab==="info")render() });
loadFX(function(){ if(ST.tab==="info")render() });
/* ===== 自動檢查更新：不需要使用者主動去按 =====
   加到主畫面的 PWA 可以在背景存活數天，只在冷啟動檢查一次是不夠的 */
var _lastCheck=0;
function autoCheck(force){
  if(navigator.onLine===false) return;
  var now=Date.now();
  if(!force && now-_lastCheck < 15*60*1000) return;   /* 15 分鐘內不重複打 */
  _lastCheck=now;
  checkUpdate(function(){ if(hasUpdate()||ST.tab==="help") render() });
}
autoCheck(true);                                        /* ① 開啟時 */
document.addEventListener("visibilitychange",function(){ /* ② 從背景切回來 */
  if(!document.hidden) autoCheck();
});
window.addEventListener("focus",function(){ autoCheck() });   /* ③ 視窗取得焦點 */
window.addEventListener("online",function(){ autoCheck(true) });/* ④ 網路恢復 */
setInterval(function(){ autoCheck() }, 30*60*1000);            /* ⑤ 每 30 分鐘 */

/* Service Worker 發現新版時也立刻反映 */
if("serviceWorker" in navigator){
  var _reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(_reloaded)return; _reloaded=true; location.reload();
  });
  navigator.serviceWorker.ready.then(function(reg){
    reg.addEventListener("updatefound",function(){ autoCheck(true) });
  }).catch(function(){});
}
if("serviceWorker" in navigator){ window.addEventListener("load",function(){
  navigator.serviceWorker.register("sw.js").catch(function(){}) }) }
</script>
